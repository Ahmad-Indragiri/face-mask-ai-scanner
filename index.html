<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mask Detector AI</title>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/blazeface"></script>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #0b0f19;
    --card: #111827;
    --border: #1f2937;
    --text: #e5e7eb;
    --muted: #9ca3af;
    --primary: #3b82f6;
    --success: #22c55e;
    --danger: #ef4444;
}

/* Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
}

/* Layout */
.wrapper {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 0;
    border-bottom: 1px solid var(--border);
}

.navbar h1 {
    font-size: 1.2rem;
    font-weight: 600;
}

/* Card */
.card {
    margin-top: 25px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
}

/* Header */
.card-header {
    margin-bottom: 15px;
}

.card-header h2 {
    font-size: 1.1rem;
    font-weight: 600;
}

.card-header p {
    font-size: 0.85rem;
    color: var(--muted);
}

/* Buttons */
.actions {
    display: flex;
    gap: 10px;
    margin: 15px 0;
}

button {
    flex: 1;
    padding: 11px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0f172a;
    color: var(--text);
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    border-color: var(--primary);
    color: white;
}

/* Status */
.status {
    font-size: 0.9rem;
    padding: 10px;
    border-radius: 8px;
    background: #0f172a;
    border: 1px solid var(--border);
    margin-bottom: 10px;
}

.success { color: var(--success); }
.danger { color: var(--danger); }

/* Media */
.preview-box {
    position: relative;
}

video, img {
    width: 100%;
    border-radius: 10px;
    display: none;
    border: 1px solid var(--border);
}

/* Loader */
.loader {
    display: none;
    margin: 15px auto;
    border: 3px solid var(--border);
    border-top: 3px solid var(--primary);
    border-radius: 50%;
    width: 28px;
    height: 28px;
    animation: spin 1s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

/* Footer */
.footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.75rem;
    color: var(--muted);
}

</style>
</head>

<body>

<div class="wrapper">

    <!-- Navbar -->
    <div class="navbar">
        <h1>Mask Detector AI</h1>
    </div>

    <!-- Card -->
    <div class="card">

        <div class="card-header">
            <h2>Detection Panel</h2>
            <p>Analisis gambar atau webcam untuk mendeteksi penggunaan masker</p>
        </div>

        <div id="status" class="status">Siap digunakan</div>
        <div id="loader" class="loader"></div>

        <div class="actions">
            <button onclick="useWebcam()">Use Webcam</button>
            <button onclick="document.getElementById('upload').click()">Upload Image</button>
        </div>

        <input type="file" id="upload" accept="image/*" hidden onchange="handleUpload(event)">

        <div class="preview-box">
            <video id="webcam" autoplay playsinline muted></video>
            <img id="preview">
        </div>

    </div>

    <div class="footer">
        Real-time AI Detection • TensorFlow.js
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
